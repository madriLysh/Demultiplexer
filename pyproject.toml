[project]
name = "demultiplexer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "madriLysh", email = "akhan0106@stu.kau.edu.sa" }
]
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.2.0",
    "scapy>=2.8.0",
]

[project.scripts]
demultiplexer = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[tool.pytest.ini_options]
pythonpath = [".", "app"]
testpaths = ["tests"]
